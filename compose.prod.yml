# 実運用向け。開発用は compose.yml のほう。
#
#   docker compose -f compose.prod.yml up -d
#
# イメージは公開してあるので、リポジトリを持ってこなくてもこのファイルだけで動きます。
# 自分で焼くなら image: を消して build: を書いてください。
#
# 手元に合わせるところは2つ。
#   1. 下の devices  … チューナーとカードリーダーのデバイス
#   2. ./config/tuners.yml … 初回起動で雛形が出てくるので、そこに機材を書く
name: denpa

services:
    # チューナーエージェント。**機材に触るのはここだけ**です。
    # 選局・チャンネルスキャン・B-CASカード・スクランブル解除を持ち、
    # 素のTSを denpa へ流します (番組表を読むのは denpa の仕事)
    tuner-agent:
        image: ghcr.io/danything/denpa-agent:latest
        restart: unless-stopped
        # チューナーとカードリーダーに触るため
        privileged: true
        devices:
            - /dev/bus
            - /dev/dvb
        environment:
            TZ: Asia/Tokyo
            # 掛かったまま録れたTSを解く先。denpa と同じ実体を見せる
            RECORDED_DIR: /denpa-recorded
        volumes:
            # 設定。初回起動で tuners.yml の雛形が出てくるので、機材はそこに書く。
            # スキャンの結果 (channels.json) も同じところへ書き戻される
            - ./config:/app-config
            - denpa-recorded:/denpa-recorded
        ports:
            - '40773:40773'

    denpa:
        image: ghcr.io/danything/denpa:latest
        restart: unless-stopped
        # 録画中に止めようとしたら、終わるまで居座ってから止まる (SHUTDOWN_WAIT)。
        # ここを伸ばしておかないと、待っている途中で殺されて意味が無くなる。
        # 録画していないときは即座に止まる
        stop_grace_period: 6h5m
        depends_on:
            - tuner-agent
        environment:
            TZ: Asia/Tokyo
            # チューナーに触る仕事はすべて向こうに頼む
            TUNER_AGENT_URL: http://tuner-agent:40773
            DENPA_DB: /app/data/denpa.db
            RECORDED_DIR: /app/recorded
            LIBRARY_DIR: /library
            ENCODE_CONCURRENCY: '2'
        volumes:
            - denpa-data:/app/data
            - denpa-recorded:/app/recorded
            - denpa-library:/library
        ports:
            - '3000:3000'

volumes:
    denpa-data:
    # 生TSの作業領域。エージェント側にも見せて、スクランブル解除をあちらにやらせる
    denpa-recorded:
    denpa-library:
