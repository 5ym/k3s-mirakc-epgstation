epg:
  cache-dir: /var/lib/mirakc/epg
jobs:
  scan-services:
    command: mirakc-arib scan-services{{#sids}} --sids={{{.}}}{{/sids}}{{#xsids}} --xsids={{{.}}}{{/xsids}}
    schedule: 0 1 8,20 * * * *
    disabled: false
  sync-clocks:
    command: mirakc-arib sync-clocks{{#sids}} --sids={{{.}}}{{/sids}}{{#xsids}} --xsids={{{.}}}{{/xsids}}
    schedule: 0 5,35 * * * * *
    disabled: false
  update-schedules:
    command: mirakc-arib collect-eits{{#sids}} --sids={{{.}}}{{/sids}}{{#xsids}} --xsids={{{.}}}{{/xsids}}
    schedule: 0 20,50 * * * * *
    disabled: false
server:
  addrs:
    - http: '0.0.0.0:40772'
  mounts:
    /miraview:
      path: /var/lib/miraview
      index: index.html
