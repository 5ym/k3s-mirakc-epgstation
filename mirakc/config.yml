tuners:
  - name: adapter0
    types: [BS, CS]
    command: >-
      recisdb tune --device /dev/dvb/adapter0/frontend0 --channel {{channel}} -
  - name: adapter1
    types: [GR]
    command: >-
      recisdb tune --device /dev/dvb/adapter1/frontend0 --channel {{channel}} -
  - name: adapter2
    types: [BS, CS]
    command: >-
      recisdb tune --device /dev/dvb/adapter2/frontend0 --channel {{channel}} -
  - name: adapter3
    types: [GR]
    command: >-
      recisdb tune --device /dev/dvb/adapter3/frontend0 --channel {{channel}} -
