apiVersion: v1
kind: Pod
metadata:
  name: scan-tuner
  namespace: epg
spec:
  restartPolicy: Never
  initContainers:
    - name: seed-config
      image: localhost/epg-mirakc:latest
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - '[ -f /etc/mirakc/config.yml ] || cp /etc/mirakc.default/config.yml /etc/mirakc/config.yml'
      volumeMounts:
        - name: mirakc-config
          mountPath: /etc/mirakc
  containers:
    - name: scan-tuner
      image: localhost/epg-mirakc:latest
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: true
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: mirakc-config
          mountPath: /etc/mirakc
        - name: dev-dvb
          mountPath: /dev/dvb
  volumes:
    - name: mirakc-config
      persistentVolumeClaim:
        claimName: mirakc-config
    - name: dev-dvb
      hostPath:
        path: /dev/dvb
        type: Directory
