# 開発環境。ホストに bun を入れずに済むよう、全部コンテナの中で完結させる。
#
#   docker compose up            … 開発サーバ + 偽Mirakurun
#   docker compose run --rm e2e  … E2E (中で偽Mirakurun/偽通知先/アプリを起動する)
#   docker compose run --rm unit … 単体テスト
#
# 実チューナーもロゴデータも要らず、ffmpeg も偽物を使うので、
# 数十分かかる ffmpeg のビルドを待たずに一通り触れる。
name: denpa

services:
    app:
        build:
            context: .
            target: dev
        command: bun run dev --host 0.0.0.0 --port 5173
        environment:
            TZ: Asia/Tokyo
            DENPA_DB: /data/denpa.db
            RECORDED_DIR: /recorded
            LIBRARY_DIR: /library
            # 開発では本物の ffmpeg (ビルドに数十分) の代わりに偽物を使う。
            # 実エンコードを試したいときだけ FFMPEG=/usr/local/bin/ffmpeg にして runtime ステージで動かす
            FFMPEG: /app/tests/fake/ffmpeg.sh
            MIRAKURUN_URL: http://mirakurun:40772
            RECONCILE_INTERVAL: '60000'
            EPG_SYNC_INTERVAL: '60000'
            SCHEDULER_TICK: '2000'
            ENCODE_CONCURRENCY: '2'
            CM_CUT_DEFAULT: chapter
            CM_DETECTOR: silence
        volumes:
            - .:/app
            - app-node-modules:/app/node_modules
            - denpa-data:/data
            - denpa-recorded:/recorded
            - denpa-library:/library
        ports:
            # ホスト側で5173が埋まっていることがあるので上書きできるようにしておく
            - '${DENPA_PORT:-5173}:5173'
        depends_on:
            - mirakurun

    # 実チューナーの代わり。番組表も録画ストリームもここが返す
    mirakurun:
        build:
            context: .
            target: dev
        command: bun tests/fake/mirakurun.ts
        environment:
            TZ: Asia/Tokyo
            FAKE_MIRAKURUN_PORT: '40772'
            # 開発中に録画完了まで見届けられるよう、1番組60秒にしておく
            FAKE_SLOT_MS: '60000'
            FAKE_SLOTS: '120'
        volumes:
            - .:/app
            - app-node-modules:/app/node_modules
        ports:
            - '40772:40772'


    e2e:
        build:
            context: .
            target: test
        profiles: ['test']
        command: bun run test:e2e
        environment:
            TZ: Asia/Tokyo
            CI: '1'
        volumes:
            - .:/app
            - app-node-modules:/app/node_modules

    unit:
        build:
            context: .
            target: dev
        profiles: ['test']
        command: bun run test:unit
        environment:
            TZ: Asia/Tokyo
            DENPA_DB: /tmp/denpa-unit.db
        volumes:
            - .:/app
            - app-node-modules:/app/node_modules

volumes:
    app-node-modules:
    denpa-data:
    denpa-recorded:
    denpa-library:
