apiVersion: v1
kind: Service
metadata:
  name: mirakc
  namespace: epg
spec:
  selector:
    app: mirakc
  ports:
    - name: http
      port: 40772
      targetPort: 40772
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: epg
spec:
  selector:
    app: db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: epgstation
  namespace: epg
spec:
  selector:
    app: epgstation
  ports:
    - name: http
      port: 8888
      targetPort: 8888
