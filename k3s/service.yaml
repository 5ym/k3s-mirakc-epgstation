apiVersion: v1
kind: Service
metadata:
  name: mirakurun
  namespace: epg
spec:
  selector:
    app: mirakurun
  ports:
    - name: http
      port: 40772
      targetPort: 40772
    # スクランブル解除の受け口 (mirakurun/descrambler.mjs)
    - name: descrambler
      port: 40773
      targetPort: 40773
---
apiVersion: v1
kind: Service
metadata:
  name: denpa
  namespace: epg
spec:
  selector:
    app: denpa
  ports:
    - name: http
      port: 3000
      targetPort: 3000
