apiVersion: v1
kind: Service
metadata:
  name: mirakc
  namespace: denpa
spec:
  selector:
    app: mirakc
  ports:
    - name: http
      port: 40772
      targetPort: 40772
    # チューナー側エージェント (mirakc/agent.py)
    - name: agent
      port: 40773
      targetPort: 40773
---
apiVersion: v1
kind: Service
metadata:
  name: denpa
  namespace: denpa
spec:
  selector:
    app: denpa
  ports:
    - name: http
      port: 3000
      targetPort: 3000
