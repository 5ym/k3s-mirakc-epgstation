apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: denpa
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: denpa
  namespace: denpa
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    # 配信と WebDAV は forward-auth を通さない。VLC も Kodi も OIDC の
    # リダイレクトを扱えないため。代わりに denpa 自身のベーシック認証で守る。
    # priority は長いマッチほど大きくしないと Host だけのルールに食われる
    - match: Host(`dp.doany.io`) && (PathPrefix(`/api/recordings`) || PathPrefix(`/dav`))
      kind: Rule
      priority: 100
      services:
        - name: denpa
          port: 3000
    - match: Host(`dp.doany.io`)
      kind: Rule
      priority: 50
      middlewares:
        - name: forward-auth
          namespace: auth
      services:
        - name: denpa
          port: 3000
---
# LAN からプレイヤー(VLC / Infuse / Kodi)で開くための口。
#
# dp.doany.io は forward-auth を通しているが、プレイヤーは OIDC のリダイレクトを
# 扱えない。こちらは forward-auth を通さず、denpa 自身のベーシック認証に任せる。
# LAN 内(10.10.0.0/16)からしか通さない。
#
# 平文で出す。.arpa は公開ドメインではないので ACME で証明書を取れず、自己署名だと
# プレイヤーが弾くことがある。中身は録画ファイルなので LAN 内ならこれで足りる。
#
# https へのリダイレクトは Traefik 側で doany.io 系だけにしてある
# (bootstrap の traefik/redirect-https.yaml)。web エントリポイント全体に
# かけると、ここも 301 で飛ばされてしまう。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: denpa-home-arpa
  namespace: denpa
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`dp.home.arpa`) && ClientIP(`10.10.0.0/16`)
      kind: Rule
      services:
        - name: denpa
          port: 3000
---
# LAN から**ブラウザで**開くための口。
#
# dp.home.arpa は平文なので、Chrome が `denpa://` の確認に
# **「常にこの種類のリンクを開く」のチェックボックスを出しません**
# (このチェックは https のページからしか出ない)。録画を1本開くたびに
# 確認を押すことになります。
#
# .arpa は公開ドメインではないので ACME で証明書を取れませんが、
# doany.io なら DNS-01 で取れます。**公開する必要はありません** — 名前を
# LAN 内のアドレス (Traefik) に向けておけば、証明書だけ本物になります。
#
# forward-auth は通しません。LAN 内 (10.10.0.0/16) からだけ通し、
# ファイルの口は denpa 自身のベーシック認証で守ります。
#
# `*.l.doany.io` は LAN 内の DNS が Traefik のアドレスに向けてあります
# (bootstrap 側の AdGuard Home)。外からは引けません。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: denpa-lan
  namespace: denpa
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    - match: Host(`dp.l.doany.io`) && ClientIP(`10.10.0.0/16`)
      kind: Rule
      services:
        - name: denpa
          port: 3000
