# 外から。OIDC (forward-auth) を通す。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: denpa
  namespace: denpa
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    # 配信と WebDAV は forward-auth を通さない。VLC も Kodi も OIDC の
    # リダイレクトを扱えないため。代わりに denpa 自身のベーシック認証で守る。
    # priority は長いマッチほど大きくしないと Host だけのルールに食われる
    - match: Host(`dp.doany.io`) && (PathPrefix(`/api/recordings`) || PathPrefix(`/dav`))
      kind: Rule
      priority: 100
      services:
        - name: denpa
          port: 3000
    - match: Host(`dp.doany.io`)
      kind: Rule
      priority: 50
      middlewares:
        # **2つ要る。** forward-auth だけだと、まだログインしていない端末に
        # oauth2-proxy の素の 401 がそのまま返り、画面には Unauthorized としか
        # 出ない (ログイン画面へ行く道が無い)。errors のほうが 401 を 302 に
        # 書き換えてサインインへ送る。順番も大事で、包む側が先
        - name: forward-auth-errors
          namespace: auth
        - name: forward-auth
          namespace: auth
      services:
        - name: denpa
          port: 3000
---
# LAN から。OIDC は通さない。
#
# ブラウザで開く口でもあり、プレイヤー (VLC / Infuse / Kodi) が録画を取りに
# 来る口でもある。プレイヤーは OIDC のリダイレクトを扱えないので、
# ここは denpa 自身のベーシック認証に任せる。
#
# **https で出す。** 平文だと Chrome が `denpa://` の確認に
# 「常にこの種類のリンクを開く」のチェックボックスを出さず (このチェックは
# https のページからしか出ない)、録画を1本開くたびに確認を押すことになる。
#
# `*.l.doany.io` は LAN 内の DNS が Traefik のアドレスに向けてある
# (bootstrap 側の AdGuard Home)。名前は公開ドメインなので DNS-01 で
# 本物の証明書が取れるが、**外からは引けない**。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: denpa-lan
  namespace: denpa
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    - match: Host(`dp.l.doany.io`) && ClientIP(`10.10.0.0/16`)
      kind: Rule
      services:
        - name: denpa
          port: 3000
