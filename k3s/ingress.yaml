# 外からも LAN からも、ここ1つ。**認証は denpa 自身がやる** (docs/auth.md)。
#
# **名前は2つあります。**
#
# | 名前 | 誰が | |
# | --- | --- | --- |
# | `dp.doany.io` | 外から | denpa がログインさせる |
# | `dp.l.doany.io` | LAN から | 同じところへ着く。名前が違うだけ |
#
# **通すかどうかは住所で決まります。** denpa は `TRUSTED_NETWORKS`
# (`10.10.0.0/16`) から来たら何も聞かず、それ以外にはログインを求めます。
# **どちらの名前で来たかは見ていません** — LAN から `dp.doany.io` を開いても
# そのまま通ります。
#
# **どちらも https で出します。** 平文だと Chrome が `denpa://` の確認に
# 「常にこの種類のリンクを開く」のチェックボックスを出さず (このチェックは
# https のページからしか出ない)、録画を1本開くたびに確認を押すことになります。
# 名前はどちらも公開ドメインなので DNS-01 で本物の証明書が取れます。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: denpa
  namespace: denpa
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    - match: Host(`dp.doany.io`) || Host(`dp.l.doany.io`)
      kind: Rule
      services:
        - name: denpa
          port: 3000
          # **宛先は Traefik に選ばせず、Service (ClusterIP) へ渡す。**
          #
          # denpa は録画中に入れ替えが来ると、終わるまで居座ってから止まる
          # (`deployment.yaml` の `terminationGracePeriodSeconds`)。その間 Pod は
          # 動いていて画面も出せるのに、**Traefik だけが 503 を返していた**。
          #
          # 実機で確かめたところ (録画2本の最中):
          #
          #     Traefik ごし   503
          #     ClusterIP 直   200
          #     Pod 直         200
          #
          # Kubernetes は消しはじめた Pod の EndpointSlice に `terminating: true` を
          # 立てる。`publishNotReadyAddresses: true` (`service.yaml`) で `ready` は
          # true のままにできるが、**Traefik 3 は `terminating` のほうも見て外す**。
          # 以前これで直ったのは `ready` しか見ていなかった頃の話で、**戻っていた**。
          #
          # `nativeLB` を立てると Traefik は宛先を自分で選ばず ClusterIP へ渡す。
          # そこから先は kube-proxy の仕事で、あちらは `publishNotReadyAddresses` を
          # 見るので届く。**replicas は1**なので、振り分けを手放す不利益は無い
          nativeLB: true
