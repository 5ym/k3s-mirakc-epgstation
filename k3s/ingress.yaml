apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mirakurun
  namespace: epg
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    - match: Host(`m.doany.io`)
      kind: Rule
      priority: 50
      middlewares:
        - name: forward-auth-errors
          namespace: auth
        - name: forward-auth
          namespace: auth
      services:
        - name: mirakurun
          port: 40772
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: epg
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: denpa
  namespace: epg
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    # 配信と WebDAV は forward-auth を通さない。mpv も Kodi も OIDC の
    # リダイレクトを扱えないため。代わりに denpa 自身のベーシック認証で守る。
    # priority は長いマッチほど大きくしないと Host だけのルールに食われる
    - match: Host(`dp.doany.io`) && (PathPrefix(`/api/recordings`) || PathPrefix(`/dav`))
      kind: Rule
      priority: 100
      services:
        - name: denpa
          port: 3000
    - match: Host(`dp.doany.io`)
      kind: Rule
      priority: 50
      middlewares:
        - name: forward-auth
          namespace: auth
      services:
        - name: denpa
          port: 3000
---
# LAN からプレイヤー(mpv / Kodi / VLC)で開くための口。
#
# dp.doany.io は forward-auth を通しているが、プレイヤーは OIDC のリダイレクトを
# 扱えない。こちらは forward-auth を通さず、denpa 自身のベーシック認証に任せる。
# LAN 内(10.10.0.0/16)からしか通さない。
#
# web エントリポイントには Traefik 全体で https へのリダイレクトがかかっていて、
# ルート単位では外せない(リダイレクトはルータの手前で起きる)。平文で受けても
# 301 で飛ばされるだけなので、こちらも websecure に置いて自己署名証明書を出す。
# .arpa は公開ドメインではないので ACME では取れない。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: denpa-home-arpa
  namespace: epg
spec:
  entryPoints:
    - websecure
  tls:
    secretName: dp-home-arpa-tls
  routes:
    - match: Host(`dp.home.arpa`) && ClientIP(`10.10.0.0/16`)
      kind: Rule
      services:
        - name: denpa
          port: 3000
