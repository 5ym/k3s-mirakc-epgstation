apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirakc
  namespace: denpa
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mirakc
  template:
    metadata:
      labels:
        app: mirakc
    spec:
      containers:
        - name: mirakc
          image: ghcr.io/danything/mirakc:sha-b4557c8108c7
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: TZ
              value: Asia/Tokyo
            # 掛かったまま録れたTSを解く先。denpa の置き場と同じ実体
            - name: RECORDED_DIR
              value: /denpa-recorded
          ports:
            - containerPort: 40772
            # チューナー側エージェント。スキャン・カードの状態・スクランブル解除の窓口
            - containerPort: 40773
          volumeMounts:
            # 設定。スキャン結果が書き戻されるのでPVCに置く。
            # /etc/mirakc は mirakc 自身の strings.yml が居るので使わない
            - name: mirakc-config
              mountPath: /app-config
            # mirakc が覚えている局・時刻・番組表。スキャンのたびに捨てて拾い直す
            - name: mirakc-epg
              mountPath: /var/lib/mirakc/epg
            - name: dev-bus
              mountPath: /dev/bus
            - name: dev-dvb
              mountPath: /dev/dvb
            # denpa の生TSの置き場。掛かったまま録れたTSはここで解く。
            # カードを読めるのはこのコンテナだけなので、denpa はパスだけ寄越す
            - name: denpa-recorded
              mountPath: /denpa-recorded
      volumes:
        - name: mirakc-config
          persistentVolumeClaim:
            claimName: mirakc-config
        - name: mirakc-epg
          persistentVolumeClaim:
            claimName: mirakc-epg
        - name: denpa-recorded
          persistentVolumeClaim:
            claimName: denpa-recorded
        - name: dev-bus
          hostPath:
            path: /dev/bus
            type: Directory
        - name: dev-dvb
          hostPath:
            path: /dev/dvb
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: denpa
  namespace: denpa
spec:
  replicas: 1
  # 録画とエンコードを抱えるので、新旧2Podが同時に走らないようにする
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: denpa
  template:
    metadata:
      labels:
        app: denpa
    spec:
      # 録画中に入れ替えが来たら、終わるまで居座ってから止まる (SHUTDOWN_WAIT)。
      # ここを伸ばしておかないと、待っている途中で SIGKILL されて意味が無くなる。
      # 録画していないときは即座に止まるので、普段の入れ替えは今までどおり速い
      terminationGracePeriodSeconds: 21900
      containers:
        - name: denpa
          image: ghcr.io/danything/denpa:sha-b4557c8108c7
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Tokyo
            # SvelteKit の CSRF 判定は Origin ヘッダと自分の origin を突き合わせる。
            # adapter-node は ORIGIN も PROTOCOL_HEADER も無いと http と決め打つので、
            # https で来た POST が全部 403 になる
            # (画面上は「押しても何も起きない」に見える)。
            # **名前は2つある** (dp.doany.io と dp.l.doany.io) ので ORIGIN では書けない。
            # Traefik が付ける x-forwarded-proto をリクエストごとに見る。
            # HOST_HEADER は既定の host のままにする。Traefik は元の Host を渡すし、
            # kubelet のヘルスチェックは x-forwarded-host を付けないため
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            # mirakc の居場所も置き場所も、既定値がそのままここの構成になっている
            # (src/lib/server/config.ts)。同じ値を書き写すと、片方だけ直したときに
            # どちらが効いているのか分からなくなる。
            # コーデック・CMの扱いも設定画面で決める
            - name: ENCODE_CONCURRENCY
              value: '2'
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: denpa-data
              mountPath: /app/data
            - name: denpa-recorded
              mountPath: /app/recorded
            - name: library
              mountPath: /library
      volumes:
        - name: denpa-data
          persistentVolumeClaim:
            claimName: denpa-data
        - name: denpa-recorded
          persistentVolumeClaim:
            claimName: denpa-recorded
        - name: library
          persistentVolumeClaim:
            claimName: denpa-library
