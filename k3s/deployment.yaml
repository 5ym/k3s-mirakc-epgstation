apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirakurun
  namespace: epg
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mirakurun
  template:
    metadata:
      labels:
        app: mirakurun
    spec:
      containers:
        - name: mirakurun
          image: ghcr.io/5ym/mirakurun:sha-2128fc38b3d9
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: TZ
              value: Asia/Tokyo
          ports:
            - containerPort: 40772
          volumeMounts:
            - name: mirakurun-data
              mountPath: /app-data
            - name: dev-bus
              mountPath: /dev/bus
            - name: dev-dvb
              mountPath: /dev/dvb
      volumes:
        - name: mirakurun-data
          persistentVolumeClaim:
            claimName: mirakurun-data
        - name: dev-bus
          hostPath:
            path: /dev/bus
            type: Directory
        - name: dev-dvb
          hostPath:
            path: /dev/dvb
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: epg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: mariadb:11.1
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: epgstation
            - name: MYSQL_DATABASE
              value: epgstation
            - name: TZ
              value: Asia/Tokyo
          ports:
            - containerPort: 3306
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: epg-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epgstation
  namespace: epg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epgstation
  template:
    metadata:
      labels:
        app: epgstation
    spec:
      containers:
        - name: epgstation
          image: ghcr.io/5ym/epgstation:sha-2128fc38b3d9
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Tokyo
            - name: XOOL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: epgstation-secrets
                  key: xool-api-key
            - name: BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: epgstation-secrets
                  key: basic-auth-password
          ports:
            - containerPort: 8888
          volumeMounts:
            - name: epgstation-data
              mountPath: /app/data
            - name: epgstation-thumbnail
              mountPath: /app/thumbnail
            - name: epgstation-logs
              mountPath: /app/logs
            - name: recorded
              mountPath: /app/recorded
      volumes:
        - name: epgstation-data
          persistentVolumeClaim:
            claimName: epgstation-data
        - name: epgstation-thumbnail
          persistentVolumeClaim:
            claimName: epgstation-thumbnail
        - name: epgstation-logs
          persistentVolumeClaim:
            claimName: epgstation-logs
        - name: recorded
          persistentVolumeClaim:
            claimName: epgstation-recorded
