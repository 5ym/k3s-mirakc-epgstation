apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirakurun
  namespace: epg
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mirakurun
  template:
    metadata:
      labels:
        app: mirakurun
    spec:
      containers:
        - name: mirakurun
          image: ghcr.io/danything/mirakurun:sha-362b05e09c5b
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: TZ
              value: Asia/Tokyo
          ports:
            - containerPort: 40772
          volumeMounts:
            - name: mirakurun-data
              mountPath: /app-data
            - name: dev-bus
              mountPath: /dev/bus
            - name: dev-dvb
              mountPath: /dev/dvb
      volumes:
        - name: mirakurun-data
          persistentVolumeClaim:
            claimName: mirakurun-data
        - name: dev-bus
          hostPath:
            path: /dev/bus
            type: Directory
        - name: dev-dvb
          hostPath:
            path: /dev/dvb
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: epg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: mariadb:11.1
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: epgstation
            - name: MYSQL_DATABASE
              value: epgstation
            - name: TZ
              value: Asia/Tokyo
          ports:
            - containerPort: 3306
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: epg-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epgstation
  namespace: epg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epgstation
  template:
    metadata:
      labels:
        app: epgstation
    spec:
      containers:
        - name: epgstation
          image: ghcr.io/danything/epgstation:sha-241280b8ad75
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Tokyo
            - name: XOOL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: epgstation-secrets
                  key: xool-api-key
            - name: BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: epgstation-secrets
                  key: basic-auth-password
          ports:
            - containerPort: 8888
          volumeMounts:
            - name: epgstation-data
              mountPath: /app/data
            - name: epgstation-thumbnail
              mountPath: /app/thumbnail
            - name: epgstation-logs
              mountPath: /app/logs
            - name: recorded
              mountPath: /app/recorded
      volumes:
        - name: epgstation-data
          persistentVolumeClaim:
            claimName: epgstation-data
        - name: epgstation-thumbnail
          persistentVolumeClaim:
            claimName: epgstation-thumbnail
        - name: epgstation-logs
          persistentVolumeClaim:
            claimName: epgstation-logs
        - name: recorded
          persistentVolumeClaim:
            claimName: epgstation-recorded
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: denpa
  namespace: epg
spec:
  replicas: 1
  # 録画とエンコードを抱えるので、新旧2Podが同時に走らないようにする
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: denpa
  template:
    metadata:
      labels:
        app: denpa
    spec:
      containers:
        - name: denpa
          image: ghcr.io/danything/denpa:sha-2af241edda1d
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Tokyo
            - name: MIRAKURUN_URL
              value: http://mirakurun:40772
            - name: DENPA_DB
              value: /app/data/denpa.db
            - name: RECORDED_DIR
              value: /app/recorded
            - name: LIBRARY_DIR
              value: /library
            # CMは既定ではチャプターを打つだけ。実カットは番組ごとにUIで選ぶ
            - name: CM_CUT_DEFAULT
              value: chapter
            - name: CM_DETECTOR
              value: silence
            # 録画のコーデック。非力なノードでは h264 にする
            - name: ENCODE_CODEC
              value: av1
            - name: ENCODE_CONCURRENCY
              value: '2'
            # mpv も Kodi も forward-auth のリダイレクトを扱えないので、
            # ファイルを取りに来る口だけベーシック認証にする。
            # 画面(dp.doany.io)は今までどおり前段の認証に任せる
            - name: BASIC_AUTH_SCOPE
              value: files
            - name: BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: denpa-secrets
                  key: basic-auth-user
                  optional: true
            - name: BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: denpa-secrets
                  key: basic-auth-password
                  optional: true
            # EPGStation からの引き継ぎ。設定画面から実行する。
            # 引き継ぎが済んで EPGStation を畳んだら、この3つと
            # epgstation-recorded のマウントごと消してよい
            - name: EPGSTATION_DB_HOST
              value: db
            - name: EPGSTATION_DB_PASSWORD
              value: epgstation
            - name: EPGSTATION_RECORDED_DIR
              value: /epgstation-recorded
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: denpa-data
              mountPath: /app/data
            - name: denpa-recorded
              mountPath: /app/recorded
            - name: library
              mountPath: /library
            # 引き継ぎ元。「移動」を選べる必要があるので読み書きで渡す。
            # epgstation Pod も同じPVCを掴むが、RWO なので同じノードに載っていれば通る
            - name: epgstation-recorded
              mountPath: /epgstation-recorded
      volumes:
        - name: denpa-data
          persistentVolumeClaim:
            claimName: denpa-data
        - name: denpa-recorded
          persistentVolumeClaim:
            claimName: denpa-recorded
        - name: library
          persistentVolumeClaim:
            claimName: denpa-library
        - name: epgstation-recorded
          persistentVolumeClaim:
            claimName: epgstation-recorded
