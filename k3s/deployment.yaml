apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuner-agent
  namespace: denpa
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tuner-agent
  template:
    metadata:
      labels:
        app: tuner-agent
      annotations:
        # **入れ替えの合図。** 像のタグは `develop` で動かないので、ここを
        # 書き換えないと ArgoCD には「何も変わっていない」ように見え、
        # 古い Pod がそのまま残る。中身を最後に変えたコミット (CI が書く)
        denpa.doany.io/agent-image: sha-63c5a76f0353
    spec:
      # **録画中に入れ替えが来たら、終わるまで居座ってから止まる** (SHUTDOWN_WAIT)。
      # denpa 側と同じ扱い。ここを既定 (30秒) のままにしていた頃は、Pod を
      # 入れ替えるだけで TS が切れ、始まって10秒の30分番組が丸ごと失敗した
      terminationGracePeriodSeconds: 21900
      containers:
        - name: tuner-agent
          image: ghcr.io/danything/denpa-agent:develop
          # 動くタグなので、起動のたびに取りに行かせる。
          # IfNotPresent だと古い develop が手元に残っていたときに黙ってそれで上がる
          imagePullPolicy: Always
          securityContext:
            privileged: true
          env:
            - name: TZ
              value: Asia/Tokyo
            # 掛かったまま録れたTSを解く先。denpa の置き場と同じ実体
            - name: RECORDED_DIR
              value: /denpa-recorded
          ports:
            # 選局・スキャン・カードの状態・スクランブル解除の窓口。**口はこれ1つ**
            - containerPort: 25252
          volumeMounts:
            # チューナーの定義 (人が書く) とスキャン結果 (エージェントが書く)。
            # Pod を作り直しても残るように PVC に置く
            - name: agent-config
              mountPath: /app-config
            - name: dev-bus
              mountPath: /dev/bus
            - name: dev-dvb
              mountPath: /dev/dvb
            # denpa の生TSの置き場。掛かったまま録れたTSはここで解く。
            # カードを読めるのはこのコンテナだけなので、denpa はパスだけ寄越す
            - name: denpa-recorded
              mountPath: /denpa-recorded
      volumes:
        - name: agent-config
          persistentVolumeClaim:
            claimName: agent-config
        - name: denpa-recorded
          persistentVolumeClaim:
            claimName: denpa-recorded
        - name: dev-bus
          hostPath:
            path: /dev/bus
            type: Directory
        - name: dev-dvb
          hostPath:
            path: /dev/dvb
            type: Directory
---
# 新しいイメージを**入れ替える前に**ノードへ引いておくだけの Job。
#
# denpa は新旧2Podを並べられない (strategy: Recreate) ので、入れ替えの間は
# 録画が途切れる。TSは追記で開いていて次の起動が続きから録り直すため、
# 落ちるのはその隙間だけ。実機で測るとその隙間は**ほぼイメージの取得時間**だった:
#
#   ScalingReplicaSet (旧Podを削除) → Pulling → Pulled 13.6秒 → Started
#
# ArgoCD の PreSync フックはマニフェスト本体より先に走るので、ここで引いておけば
# 入れ替えのときにはノードの手元にあり、取得が要らなくなる。
# 中身は動かさない (/bin/true)。引くことだけが目的
apiVersion: batch/v1
kind: Job
metadata:
  name: denpa-prepull
  namespace: denpa
  annotations:
    argocd.argoproj.io/hook: PreSync
    # 前回の残骸は次に作るときに消す (成功したものを残しておくと様子が見られる)
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: prepull
          image: ghcr.io/danything/denpa:develop
          # **ここは必ず取りに行かせる。** IfNotPresent だと、古い develop が
          # ノードに残っているかぎり何も引かず、引いておく意味が無くなる
          imagePullPolicy: Always
          command: ['/bin/true']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: denpa
  namespace: denpa
spec:
  replicas: 1
  # 録画とエンコードを抱えるので、新旧2Podが同時に走らないようにする
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: denpa
  template:
    metadata:
      labels:
        app: denpa
      annotations:
        # **入れ替えの合図** (上の tuner-agent と同じ理由)。CI が書き換える
        denpa.doany.io/denpa-image: sha-9b8da31b4776
    spec:
      # 録画中に入れ替えが来たら、終わるまで居座ってから止まる (SHUTDOWN_WAIT)。
      # ここを伸ばしておかないと、待っている途中で SIGKILL されて意味が無くなる。
      # 録画していないときは即座に止まるので、普段の入れ替えは今までどおり速い
      terminationGracePeriodSeconds: 21900
      containers:
        - name: denpa
          image: ghcr.io/danything/denpa:develop
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Tokyo
            # SvelteKit の CSRF 判定は Origin ヘッダと自分の origin を突き合わせる。
            # adapter-node は ORIGIN も PROTOCOL_HEADER も無いと http と決め打つので、
            # https で来た POST が全部 403 になる
            # (画面上は「押しても何も起きない」に見える)。
            # **名前は2つある** (dp.doany.io と dp.l.doany.io) ので ORIGIN では書けない。
            # Traefik が付ける x-forwarded-proto をリクエストごとに見る。
            # HOST_HEADER は既定の host のままにする。Traefik は元の Host を渡すし、
            # kubelet のヘルスチェックは x-forwarded-host を付けないため
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            # エージェントの居場所も置き場所も、既定値がそのままここの構成になっている
            # (src/lib/server/config.ts)。同じ値を書き写すと、片方だけ直したときに
            # どちらが効いているのか分からなくなる。
            # コーデック・CMの扱いも設定画面で決める
            - name: ENCODE_CONCURRENCY
              value: '2'
            # **OIDC でのログイン** (docs/auth.md)。
            #
            # 値は oauth2-proxy が使っているアプリ登録と同じものを、denpa 名前空間の
            # Secret `denpa-oidc` に写してある。中身は `oidc-sealed.yaml` に封をして
            # あり (SealedSecret)、それを controller が Secret にする。
            # 作り直すときは docs/auth.md の手順。
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef: { name: denpa-oidc, key: issuer }
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: denpa-oidc, key: client-id }
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: denpa-oidc, key: client-secret }
            # このグループに居る人だけ入れる (oauth2-proxy の ALLOWED_GROUPS と同じ)
            - name: OIDC_GROUP
              valueFrom:
                secretKeyRef: { name: denpa-oidc, key: group }
            # **LAN の網から来たときだけ、何も聞かずに通す。**
            # ベーシック認証も OIDC も掛からないので、プレイヤー (VLC / Kodi /
            # Infuse) に資格情報を入れずに使える。
            #
            # **見るのは住所だけ。** どの名前で来たかは問わない (LAN からは
            # 外向きの `dp.doany.io` で来ても通る)。名前で分けるのは前段の仕事で、
            # ingress 側が `dp.l.doany.io` に `ClientIP` を条件に付けている。
            #
            # `ADDRESS_HEADER` が無いと adapter-node は Traefik の Pod の住所を
            # 返すので、ここが誰にも当たらない (=全員ログインを求められる)
            - name: TRUSTED_NETWORKS
              value: 10.10.0.0/16
            - name: ADDRESS_HEADER
              value: x-forwarded-for
            # **ホーム画面に置いたときの名前。来た名前ごとに変える。**
            # 同じ denpa を2つの名前で出しているので、両方入れると同じ名前の
            # アイコンが2つ並び、どちらが家の中から繋がるほうか分からない
            - name: PWA_NAMES
              value: dp.doany.io=denpa,dp.l.doany.io=denpa 宅内
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: denpa-data
              mountPath: /app/data
            - name: denpa-recorded
              mountPath: /app/recorded
            - name: library
              mountPath: /library
      volumes:
        - name: denpa-data
          persistentVolumeClaim:
            claimName: denpa-data
        - name: denpa-recorded
          persistentVolumeClaim:
            claimName: denpa-recorded
        - name: library
          persistentVolumeClaim:
            claimName: denpa-library
