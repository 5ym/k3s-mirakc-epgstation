apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirakc
  namespace: epg
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mirakc
  template:
    metadata:
      labels:
        app: mirakc
    spec:
      containers:
        - name: mirakc
          image: ghcr.io/danything/mirakc:sha-ef66defa8a52
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: TZ
              value: Asia/Tokyo
            # 掛かったまま録れたTSを解く先。denpa の置き場と同じ実体
            - name: RECORDED_DIR
              value: /denpa-recorded
          ports:
            - containerPort: 40772
            # チューナー側エージェント。スキャン・カードの状態・スクランブル解除の窓口
            - containerPort: 40773
          volumeMounts:
            # 設定。スキャン結果が書き戻されるのでPVCに置く。
            # /etc/mirakc は mirakc 自身の strings.yml が居るので使わない
            - name: mirakc-config
              mountPath: /app-config
            # mirakc が覚えている局・時刻・番組表。スキャンのたびに捨てて拾い直す
            - name: mirakc-epg
              mountPath: /var/lib/mirakc/epg
            - name: dev-bus
              mountPath: /dev/bus
            - name: dev-dvb
              mountPath: /dev/dvb
            # denpa の生TSの置き場。掛かったまま録れたTSはここで解く。
            # カードを読めるのはこのコンテナだけなので、denpa はパスだけ寄越す
            - name: denpa-recorded
              mountPath: /denpa-recorded
      volumes:
        - name: mirakc-config
          persistentVolumeClaim:
            claimName: mirakc-config
        - name: mirakc-epg
          persistentVolumeClaim:
            claimName: mirakc-epg
        - name: denpa-recorded
          persistentVolumeClaim:
            claimName: denpa-recorded
        - name: dev-bus
          hostPath:
            path: /dev/bus
            type: Directory
        - name: dev-dvb
          hostPath:
            path: /dev/dvb
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: denpa
  namespace: epg
spec:
  replicas: 1
  # 録画とエンコードを抱えるので、新旧2Podが同時に走らないようにする
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: denpa
  template:
    metadata:
      labels:
        app: denpa
    spec:
      containers:
        - name: denpa
          image: ghcr.io/danything/denpa:sha-4e54c70a9698
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Tokyo
            # SvelteKit の CSRF 判定は Origin ヘッダと自分の origin を突き合わせる。
            # adapter-node は ORIGIN も PROTOCOL_HEADER も無いと https と決め打つので、
            # 平文で開いている dp.home.arpa からの POST が全部 403 になっていた
            # (画面上は「押しても何も起きない」に見える)。
            # ORIGIN は1つしか書けず dp.doany.io と両立しないので、
            # Traefik が付ける x-forwarded-proto をリクエストごとに見る。
            # HOST_HEADER は既定の host のままにする。Traefik は元の Host を渡すし、
            # kubelet のヘルスチェックは x-forwarded-host を付けないため
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: MIRAKC_URL
              value: http://mirakc:40772
            # チューナーに触る仕事はすべて向こうに頼む。カードも tuner デバイスも
            # このコンテナからは開けない
            - name: TUNER_AGENT_URL
              value: http://mirakc:40773
            # DBと、放送波から拾った局ロゴの置き場
            - name: DENPA_DB
              value: /app/data/denpa.db
            - name: RECORDED_DIR
              value: /app/recorded
            - name: LIBRARY_DIR
              value: /library
            # CMは既定ではチャプターを打つだけ。実カットは番組ごとにUIで選ぶ
            - name: CM_CUT_DEFAULT
              value: chapter
            - name: CM_DETECTOR
              value: silence
            # 録画のコーデック。非力なノードでは h264 にする
            - name: ENCODE_CODEC
              value: av1
            - name: ENCODE_CONCURRENCY
              value: '2'
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: denpa-data
              mountPath: /app/data
            - name: denpa-recorded
              mountPath: /app/recorded
            - name: library
              mountPath: /library
      volumes:
        - name: denpa-data
          persistentVolumeClaim:
            claimName: denpa-data
        - name: denpa-recorded
          persistentVolumeClaim:
            claimName: denpa-recorded
        - name: library
          persistentVolumeClaim:
            claimName: denpa-library
