# dp.home.arpa 用の自己署名証明書 (LAN 限定)。
#
# Traefik の web エントリポイントには全体で https へのリダイレクトがかかっていて、
# ルート単位では外せない。平文で待ち受けても 301 で https に飛ばされるだけなので、
# こちらも websecure に置く。.arpa は公開ドメインではなく ACME で証明書を取れない
# ため自己署名にしてある。
#
# 秘密鍵をリポジトリに置いているが、この経路は 10.10.0.0/16 からしか通さず、
# ブラウザには元々証明書の警告が出る前提。mpv と Kodi は検証しないのでそのまま通る。
# 有効期限 2036-07-29。
apiVersion: v1
kind: Secret
metadata:
  name: dp-home-arpa-tls
  namespace: epg
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
