# Fixed self-signed certificate for e.home.arpa (LAN-only access).
# Not sensitive: this route is restricted to 10.10.0.0/16 and browsers
# already show a certificate warning for it by design. Valid until 2036-07-22.
apiVersion: v1
kind: Secret
metadata:
  name: e-home-arpa-tls
  namespace: epg
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
