apiVersion: v1
kind: ServiceAccount
metadata:
  name: collect-logos
  namespace: epg
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: collect-logos-restart-mirakc
  namespace: epg
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["mirakc"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: collect-logos-restart-mirakc
  namespace: epg
subjects:
  - kind: ServiceAccount
    name: collect-logos
    namespace: epg
roleRef:
  kind: Role
  name: collect-logos-restart-mirakc
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: collect-logos
  namespace: epg
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: collect-logos
          initContainers:
            - name: seed-config
              image: localhost/mirakc:latest
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - '[ -f /etc/mirakc/config.yml ] || cp /etc/mirakc.default/config.yml /etc/mirakc/config.yml'
              volumeMounts:
                - name: mirakc-config
                  mountPath: /etc/mirakc
          containers:
            - name: collect-logos
              image: localhost/mirakc:latest
              imagePullPolicy: IfNotPresent
              command:
                - /scheduled-collect-logos.sh
              env:
                - name: TZ
                  value: Asia/Tokyo
                - name: MIRAKC_URL
                  value: http://mirakc.epg.svc.cluster.local:40772
                - name: EPGSTATION_URL
                  value: http://epgstation.epg.svc.cluster.local:8888
                - name: CONFIG_FILE
                  value: /etc/mirakc/config.yml
                - name: OUTPUT_DIR
                  value: /var/lib/mirakc/logos
                - name: MAX_RUNTIME_SECONDS
                  value: "1700"
                - name: LOOKAHEAD_MINUTES
                  value: "30"
              volumeMounts:
                - name: mirakc-config
                  mountPath: /etc/mirakc
                - name: mirakc-logos
                  mountPath: /var/lib/mirakc/logos
          volumes:
            - name: mirakc-config
              persistentVolumeClaim:
                claimName: mirakc-config
            - name: mirakc-logos
              persistentVolumeClaim:
                claimName: mirakc-logos
