apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mirakurun-data
  namespace: epg
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: denpa-data
  namespace: epg
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 5Gi
---
# 生TSの作業領域。エンコードが終われば消えるのでライブラリほどの容量は要らない
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: denpa-recorded
  namespace: epg
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 300Gi
---
# エンコード済みの置き場。denpa がここから配り、削除も denpa がやる。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: denpa-library
  namespace: epg
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 1Ti
