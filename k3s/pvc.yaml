# エージェントの設定。**2つのファイルが入る。**
#
#   tuners.json   … 繋いである機材。denpa の画面から書き換える
#   channels.json … スキャンで見つかったチャンネル。エージェントが書く
#
# どちらもイメージに焼かずPVCに置く。どちらも無ければ空から始まる
# (.NET 版は刺さっている機材を自分で見つける)。
# 番組表はもうここには居ない (denpa の DB が持つ)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-config
  namespace: denpa
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: denpa-data
  namespace: denpa
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 5Gi
---
# 生TSの作業領域。エンコードが終われば消えるのでライブラリほどの容量は要らない
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: denpa-recorded
  namespace: denpa
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 300Gi
---
# エンコード済みの置き場。denpa がここから配り、削除も denpa がやる。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: denpa-library
  namespace: denpa
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 1Ti
