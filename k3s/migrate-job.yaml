# EPGStation の録画を denpa に引き継ぐための使い捨てJob。
#
#   kubectl -n epg apply -f k3s/migrate-job.yaml     # まず何が起きるか見る
#   kubectl -n epg logs -f job/denpa-migrate
#
# 実際に取り込むときは args を ["--apply"] にして applyし直す。
# 既定はコピーなので、取り込んだ結果を確かめてから EPGStation 側のPVCを消せる。
# 容量が足りないときは ["--apply", "--move"]。
#
# ArgoCD に消されないよう Prune=false を付けてある。終わったら手で消すこと。
apiVersion: batch/v1
kind: Job
metadata:
  name: denpa-migrate
  namespace: epg
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # 途中で落ちても作りかけの録画行が残るだけで、再実行すれば取り込み済みは飛ばされる
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/danything/denpa:latest
          command: ['bun', 'scripts/migrate-epgstation.ts']
          args: []
          env:
            - name: TZ
              value: Asia/Tokyo
            - name: DENPA_DB
              value: /app/data/denpa.db
            - name: LIBRARY_DIR
              value: /library
            # EPGStation の MariaDB。k3s/deployment.yaml の db と同じ値
            - name: EPGSTATION_DB_HOST
              value: db
            - name: EPGSTATION_DB_PASSWORD
              value: epgstation
            - name: EPGSTATION_RECORDED_DIR
              value: /epgstation-recorded
          volumeMounts:
            - name: denpa-data
              mountPath: /app/data
            - name: library
              mountPath: /library
            # 引き継ぎ元。読むだけなので --move を使わない限り readOnly でよい
            - name: epgstation-recorded
              mountPath: /epgstation-recorded
      volumes:
        - name: denpa-data
          persistentVolumeClaim:
            claimName: denpa-data
        - name: library
          persistentVolumeClaim:
            claimName: denpa-library
        - name: epgstation-recorded
          persistentVolumeClaim:
            claimName: epgstation-recorded
