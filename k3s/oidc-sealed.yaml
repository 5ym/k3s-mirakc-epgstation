# **OIDC の設定。封をしてあるので、これは git に置けます。**
#
# SealedSecret はクラスタの中の鍵でしか開けません。封をした側 (この YAML) は
# 公開リポジトリに置いても中身が読めず、`kube-system` の
# `sealed-secrets-controller` が同じ名前・同じ名前空間の Secret `denpa-oidc` を
# 作ります。deployment.yaml はそれを `secretKeyRef` で引きます。
#
# **名前と名前空間を変えると開けなくなります。** 既定の scope (strict) は
# `denpa/denpa-oidc` を鍵の一部にしているためです。移すときは封をし直します。
#
# 中身は4つ。値の意味は docs/auth.md:
#
# | 鍵 | |
# | --- | --- |
# | `issuer` | `https://login.microsoftonline.com/<tenant>/v2.0` |
# | `client-id` | アプリ登録のアプリケーションID |
# | `client-secret` | クライアントシークレット |
# | `group` | このグループに居る人だけ通す (オブジェクトID) |
#
# **作り直しかた** (main の上で):
#
#   umask 077
#   cat > /tmp/oidc.yaml <<'YAML'
#   apiVersion: v1
#   kind: Secret
#   metadata: { name: denpa-oidc, namespace: denpa }
#   type: Opaque
#   stringData:
#     issuer: "..."
#     client-id: "..."
#     client-secret: "..."
#     group: "..."
#   YAML
#   ~/bootstrap/kubeseal.sh /tmp/oidc.yaml k3s/oidc-sealed.yaml && rm /tmp/oidc.yaml
#
# **元の平文は消すこと。** git に入れてよいのは封をしたこちらだけです。
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: denpa-oidc
  namespace: denpa
spec:
  encryptedData:
    client-id: 
    client-secret: 
    group: 
    issuer: 
  template:
    metadata:
      name: denpa-oidc
      namespace: denpa
    type: Opaque
