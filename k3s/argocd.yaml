# This repo's ArgoCD配置. The ApplicationSet in danything/bootstrap
# (argocd/appsets/repos.yaml) scans the org for this file and builds this
# repo's Application from it -- so everything about how this repo gets
# deployed is decided here, not in the cluster or in bootstrap.
name: denpa
namespace: denpa

# Directory holding the manifests, relative to the repo root.
sourcePath: k3s
recurse: false

# autoSync: false leaves the app on manual sync in the UI.
autoSync: true
prune: true
selfHeal: true
