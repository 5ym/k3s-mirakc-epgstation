name: Test denpa

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k3s/**'
      - 'windows/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'k3s/**'
      - 'windows/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch: {}

concurrency:
  group: test-denpa-${{ github.ref }}
  cancel-in-progress: true

# 本番コンテナは TZ=Asia/Tokyo で動く。放送日やXMLTVのオフセットはローカル時刻で
# 組み立てるので、ランナー既定のUTCのままだとテストが本番と違う値を見ることになる
env:
  TZ: Asia/Tokyo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 開発は compose 前提だが、CIでイメージを組むと数分かかるうえ
      # ffmpeg も実チューナーも要らない(テストは全部偽物を使う)ので、
      # ランナーに直接 bun を入れて回す。
      # bun のバージョンは Dockerfile と食い違わないよう、そこから読む
      - name: Read bun version from Dockerfile
        id: bun
        run: echo "version=$(grep -oP 'oven/bun:\K[^-\s]+' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint

      - name: Type check
        run: bun run check

      # denpa 本体と、チューナーエージェント (agent/) の両方
      - name: Unit tests
        run: bun run test:unit

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # 手で書いた YAML 読みと、チューナー自動検出の値の読み取り
      - name: Unit tests (.NET agent)
        run: dotnet test agent-dotnet/Denpa.Agent.Tests/Denpa.Agent.Tests.csproj

      # **同じものを2回通す。** エージェントの口に直接当てるテストで、
      # bun 版と .NET 版が同じように振る舞うことがここで担保される
      - name: Conformance (bun agent)
        run: bun test agent/conformance.test.ts

      - name: Build .NET agent
        run: dotnet publish agent-dotnet/Denpa.Agent/Denpa.Agent.csproj -c Release -r linux-x64 -o agent-dotnet/publish

      - name: Conformance (.NET agent)
        run: AGENT_CMD="$PWD/agent-dotnet/publish/denpa-agent" bun test agent/conformance.test.ts

      # ブラウザは 150MB ほどあり、毎回落とすと1分近く持っていかれる。
      # 中身は Playwright のバージョンでしか変わらないので、それを鍵にする
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(bun pm ls | grep -oP '@playwright/test@\K[^\s]+' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # --with-deps は OS のライブラリを入れるところで、キャッシュに乗らない。
      # ブラウザが残っていても毎回要る (入っていれば数秒で終わる)
      - name: Install Playwright browser
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi

      # アプリを1度だけ組んでから、ワーカーの数だけ立てる。
      # 偽エージェント・偽通知先もワーカーごとに1式ずつ (tests/stack.ts)
      - name: E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
