name: Test denpa

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k3s/**'
      - 'windows/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'k3s/**'
      - 'windows/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch: {}

concurrency:
  group: test-denpa-${{ github.ref }}
  cancel-in-progress: true

# 本番コンテナは TZ=Asia/Tokyo で動く。放送日やXMLTVのオフセットはローカル時刻で
# 組み立てるので、ランナー既定のUTCのままだとテストが本番と違う値を見ることになる
env:
  TZ: Asia/Tokyo

# **3つに割って同時に流します。**
#
# 1本に並べていた頃は 4分37秒 で、そのうち 181秒 が E2E でした。他は全部
# 合わせても1分ありません。待っているのは**いちばん遅い1つ**だけでよいので、
# 中身の関係ない3つを別のランナーに出しています。
#
# E2E はさらに3つに割ります。ランナーは4コアなので、1台では4ワーカーが上限。
# 3台なら12ワーカーぶん並びます (中身は待ち時間が大半なので、割った分だけ効く。
# docs/development.md「並べて流す」)。
jobs:
  # リント・型・単体。**いちばん早く赤くなるところ**なので、先に見えるように分ける
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 開発は compose 前提だが、CIでイメージを組むと数分かかるうえ
      # ffmpeg も実チューナーも要らない(テストは全部偽物を使う)ので、
      # ランナーに直接 bun を入れて回す。
      # bun のバージョンは Dockerfile と食い違わないよう、そこから読む
      - name: Read bun version from Dockerfile
        id: bun
        run: echo "version=$(grep -oP 'oven/bun:\K[^-\s]+' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint

      - name: Type check
        run: bun run check

      # denpa 本体だけ。エージェントは .NET なので下の agent ジョブで見る
      # (`agent/conformance.test.ts` は焼いた実行ファイルが要るので、ここには入れない)
      - name: Unit tests
        run: bun run test:unit

  # チューナーエージェント (.NET)。設定の読み書き・選局表と、口への適合テスト
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read bun version from Dockerfile
        id: bun
        run: echo "version=$(grep -oP 'oven/bun:\K[^-\s]+' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 設定の読み書き、選局表、チューナー自動検出の値の読み取り
      - name: Unit tests (.NET agent)
        run: dotnet test agent/Denpa.Agent.Tests/Denpa.Agent.Tests.csproj

      # エージェントの口に直接当てるテスト。**本物を焼いて起こして**、偽の選局
      # コマンドで流す (bun 版が居た頃は、同じものを2つの実装に通していた)。
      # 焼くところまで含めて1つの script にしてある — 手元で走らせるときに
      # 焼き忘れると、消えた既定の置き場を叩いて ENOENT で落ちるだけになる
      - name: Conformance
        run: bun run test:conformance

  # 予約から録画・エンコード・保存先への配置まで、偽の放送で通しで流す
  e2e:
    runs-on: ubuntu-latest
    strategy:
      # 1つ落ちても残りは最後まで流す。落ち方を全部まとめて見たい
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read bun version from Dockerfile
        id: bun
        run: echo "version=$(grep -oP 'oven/bun:\K[^-\s]+' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ブラウザは 150MB ほどあり、毎回落とすと1分近く持っていかれる。
      # 中身は Playwright のバージョンでしか変わらないので、それを鍵にする
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(bun pm ls | grep -oP '@playwright/test@\K[^\s]+' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # --with-deps は OS のライブラリを入れるところで、キャッシュに乗らない。
      # ブラウザが残っていても毎回要る (入っていれば数秒で終わる)
      - name: Install Playwright browser
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi

      # アプリを1度だけ組んでから、ワーカーの数だけ立てる。
      # 偽エージェント・偽通知先もワーカーごとに1式ずつ (tests/stack.ts)
      - name: E2E tests
        run: bunx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # 割った先ごとに名前を変える。同じ名前だと後から上げたほうで断られる
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7
