name: Test denpa

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/test.yml'
  workflow_dispatch: {}

concurrency:
  group: test-denpa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 開発は compose 前提だが、CIでイメージを組むと数分かかるうえ
      # ffmpeg も実チューナーも要らない(テストは全部偽物を使う)ので、
      # ランナーに直接 bun を入れて回す。
      # bun のバージョンは Dockerfile と食い違わないよう、そこから読む
      - name: Read bun version from Dockerfile
        id: bun
        run: echo "version=$(grep -oP 'oven/bun:\K[^-\s]+' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test:unit

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      # 偽Mirakurun・偽Jellyfin・偽ffmpeg は playwright.config.ts の webServer が
      # まとめて起動する
      - name: E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7
