name: Build and deploy images

on:
  push:
    branches: [main]
    paths:
      - 'mirakurun/Dockerfile'
      - 'mirakurun/*.yml'
      - 'epgstation/Dockerfile'
      - 'epgstation/*.js'
      - 'epgstation/*.yml'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch: {}

# Only manifests under k3s/ are rewritten by this workflow, and that path is
# not in the trigger filter above, so the rewrite-and-push step below can't
# retrigger this same workflow.
concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "mirakurun=true" >> "$GITHUB_OUTPUT"
            echo "epgstation=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          echo "${changed}"
          echo "mirakurun=$(echo "${changed}" | grep -qE '^mirakurun/(Dockerfile|.*\.yml)$' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "epgstation=$(echo "${changed}" | grep -qE '^epgstation/(Dockerfile|.*\.js|.*\.yml)$' && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.changes.outputs.mirakurun == 'true' || steps.changes.outputs.epgstation == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.changes.outputs.mirakurun == 'true' || steps.changes.outputs.epgstation == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push mirakurun image
        if: steps.changes.outputs.mirakurun == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./mirakurun
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mirakurun:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mirakurun:latest

      - name: Build and push epgstation image
        if: steps.changes.outputs.epgstation == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./epgstation
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/epgstation:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/epgstation:latest

      - name: Rewrite image tags in manifests
        if: steps.changes.outputs.mirakurun == 'true' || steps.changes.outputs.epgstation == 'true'
        run: |
          set -eu
          OWNER="${{ github.repository_owner }}"
          TAG="${{ steps.tag.outputs.tag }}"
          FILES="k3s/deployment.yaml"

          if [ "${{ steps.changes.outputs.mirakurun }}" = "true" ]; then
            sed -i -E "s#image: [^[:space:]]*/mirakurun:[^[:space:]]*#image: ${{ env.REGISTRY }}/${OWNER}/mirakurun:${TAG}#g" ${FILES}
          fi
          if [ "${{ steps.changes.outputs.epgstation }}" = "true" ]; then
            sed -i -E "s#image: [^[:space:]]*/epgstation:[^[:space:]]*#image: ${{ env.REGISTRY }}/${OWNER}/epgstation:${TAG}#g" k3s/deployment.yaml
          fi

      - name: Commit and push manifest updates
        if: steps.changes.outputs.mirakurun == 'true' || steps.changes.outputs.epgstation == 'true'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k3s/deployment.yaml
          if git diff --cached --quiet; then
            echo "no manifest changes to commit"
            exit 0
          fi
          git commit -m "chore: bump image tag to ${{ steps.tag.outputs.tag }} [skip ci]"
          git push
