name: Build and deploy images

on:
  push:
    branches: [main]
    paths:
      - 'mirakurun/Dockerfile'
      - 'mirakurun/*.yml'
      - 'epgstation/Dockerfile'
      - 'epgstation/*.js'
      - 'epgstation/*.yml'
      - 'app/**'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch: {}

# Only manifests under k3s/ are rewritten by this workflow, and that path is
# not in the trigger filter above, so the rewrite-and-push step below can't
# retrigger this same workflow.
concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push mirakurun image
        uses: docker/build-push-action@v7
        with:
          context: ./mirakurun
          platforms: linux/amd64
          push: true
          pull: true
          cache-from: type=gha,scope=mirakurun
          cache-to: type=gha,mode=max,scope=mirakurun
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mirakurun:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/mirakurun:latest

      - name: Build and push epgstation image
        uses: docker/build-push-action@v7
        with:
          context: ./epgstation
          platforms: linux/amd64
          push: true
          pull: true
          cache-from: type=gha,scope=epgstation
          cache-to: type=gha,mode=max,scope=epgstation
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/epgstation:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/epgstation:latest

      - name: Build and push denpa image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          target: runtime
          platforms: linux/amd64
          push: true
          pull: true
          cache-from: type=gha,scope=denpa
          cache-to: type=gha,mode=max,scope=denpa
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/denpa:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/denpa:latest

      - name: Rewrite image tags in manifests
        run: |
          set -eu
          OWNER="${{ github.repository_owner }}"
          TAG="${{ steps.tag.outputs.tag }}"
          FILES="k3s/deployment.yaml"

          sed -i -E "s#image: [^[:space:]]*/mirakurun:[^[:space:]]*#image: ${{ env.REGISTRY }}/${OWNER}/mirakurun:${TAG}#g" ${FILES}
          sed -i -E "s#image: [^[:space:]]*/epgstation:[^[:space:]]*#image: ${{ env.REGISTRY }}/${OWNER}/epgstation:${TAG}#g" ${FILES}
          sed -i -E "s#image: [^[:space:]]*/denpa:[^[:space:]]*#image: ${{ env.REGISTRY }}/${OWNER}/denpa:${TAG}#g" ${FILES}

      - name: Commit and push manifest updates
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k3s/deployment.yaml
          if git diff --cached --quiet; then
            echo "no manifest changes to commit"
            exit 0
          fi
          git commit -m "chore: bump image tag to ${{ steps.tag.outputs.tag }} [skip ci]"

          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying (${i})"
            git fetch origin main
            git rebase origin/main
          done
          echo "failed to push manifest updates after retries"
          exit 1
